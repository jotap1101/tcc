[project]
name = "tcc"
version = "0.1.0"
description = "Segmentação semântica de cafezais: U-Net (CNN) vs SegFormer (ViT) em imagens Sentinel-2."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
keywords = [
  "semantic-segmentation",
  "remote-sensing",
  "coffee",
  "sentinel-2",
  "unet",
  "segformer",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
]

# Dependências base (leves) — necessárias para importar o pacote e rodar o CI.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "tqdm>=4.66",
  "pillow>=10.0",
  "huggingface-hub>=0.23",
]

# Dependências pesadas ficam em extras para manter o CI rápido.
[project.optional-dependencies]
geo = [
  "rasterio>=1.3",
  "geopandas>=0.14",
  "shapely>=2.0",
  "earthengine-api>=0.1.390",
  "geemap>=0.30",
]
ml = [
  "torch>=2.1",
  "torchvision>=0.16",
  "transformers>=4.40",
  "albumentations>=1.4",
]
dev = [
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "types-PyYAML>=6.0",
  "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
  "yaml.*",
  "numpy.*",
  "pandas.*",
  "torch.*",
  "torchvision.*",
  "transformers.*",
  "rasterio.*",
  "geopandas.*",
  "shapely.*",
  "ee.*",
  "geemap.*",
  "albumentations.*",
  "sklearn.*",
  "matplotlib.*",
  "seaborn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
