# ==============================================================================
# Fonte única de verdade da configuração do projeto.
# Carregado exclusivamente por src/config.py; nenhum caminho deve ser
# codificado diretamente em notebooks ou no restante do pacote.
# ==============================================================================

project:
  name: tcc-coffee-segmentation
  version: "0.1.0"
  # Semente global fixa para python/numpy/torch/cuda (reprodutibilidade).
  seed: 42

# Diretórios resolvidos a partir da raiz do repositório (ou de TCC_ROOT).
paths:
  data: data
  raw: data/raw
  interim: data/interim
  processed: data/processed
  external: data/external
  models: models
  artifacts: artifacts
  # Manifesto versionado que registra cada patch do conjunto de dados.
  manifest: data/processed/manifest.parquet

# Área de estudo: Região Geográfica Imediata de Guaxupé - MG (código IBGE 310044).
aoi:
  region_code: "310044"
  region_name: "Região Geográfica Imediata de Guaxupé"
  state: "MG"
  # Coluna da malha vetorial do IBGE que identifica a região imediata.
  region_code_column: "CD_RGI"
  mesh_path: data/external/MG_RG_Imediatas_2025/MG_RG_Imediatas_2025.shp

# Aquisição no Google Earth Engine (Sentinel-2 Nível-2A).
gee:
  image_collection: "COPERNICUS/S2_SR_HARMONIZED"
  cloud_collection: "COPERNICUS/S2_CLOUD_PROBABILITY"
  # Coleção Cloud Score+ (pontuação contínua de céu claro, 10 m).
  cloud_score_plus_collection: "GOOGLE/CLOUD_SCORE_PLUS/V1/S2_HARMONIZED"
  # Banda e limiar de máscara de nuvem (0 = não claro, 1 = claro).
  cloud_score_band: "cs_cdf"
  cloud_score_threshold: 0.60
  # Banda de QA nativa usada como fallback quando Cloud Score+ não cobre a cena.
  qa_band: "QA60"
  # Estatística de composição temporal das cenas livres de nuvem.
  composite: "median"
  # Janela sazonal provisória (estação seca), refinada na fase de aquisição.
  start_date: "2023-06-01"
  end_date: "2023-09-30"
  bands: ["B2", "B3", "B4", "B8"]
  cloud_filter_pct: 20
  scale_m: 10
  # UTM zona 23S, adequada para Minas Gerais.
  crs: "EPSG:31983"
  max_pixels: 10000000000000
  # Pasta no Google Drive usada pelas exportações (fase de aquisição).
  export_folder: "tcc_coffee_gee"
  # Prefixo dos arquivos exportados no Drive.
  export_prefix: "guaxupe"

# Máscaras de referência (verdade de campo) para a classe café.
masks:
  # Ano de referência das máscaras.
  year: 2023
  # Classe de café na legenda MapBiomas.
  coffee_class: 46
  # Asset MapBiomas 10 m (Coleção 3, Sentinel-2).
  mapbiomas_10m_asset: "projects/mapbiomas-public/assets/brazil/lulc_10m/collection3/mapbiomas_10m_collection3_integration_v1"
  # Asset MapBiomas 30 m (Coleção 10.1).
  mapbiomas_30m_asset: "projects/mapbiomas-public/assets/brazil/lulc/collection10_1/mapbiomas_brazil_collection10_1_coverage_v1"
  # Nome da banda de classificação no asset MapBiomas.
  mapbiomas_band: "classification"
  # Coleção de embeddings anuais (AlphaEarth / Satellite Embedding), 64 bandas.
  alphaearth_collection: "GOOGLE/SATELLITE_EMBEDDING/V1/ANNUAL"
  alphaearth_year: 2023
  # Número de clusters do k-means usado como máscara candidata.
  alphaearth_clusters: 8
  # Número de amostras de pixels para treinar o clusterizador.
  alphaearth_samples: 5000
  # Fontes candidatas comparadas na fase 2 (ordem de exibição dos diagnósticos).
  candidates:
    - "mapbiomas_coffee"
    - "alphaearth_clusters"
  # Fonte eleita como verdade de campo (definida ao fim da fase 2).
  selected_source: null
  # Diretório local com os GeoTIFF exportados (baixados do Google Drive).
  local_dir: data/raw/masks
  # Diretório local das máscaras finais alinhadas ao grid da composição.
  final_dir: data/processed/masks
  # Limiar de prevalência por cluster usado para binarizar o k-means.
  cluster_threshold: 0.5

# Construção do conjunto de dados e validação espacial.
dataset:
  patch_size: 512
  fold_count: 5
  # Proporção mínima de pixels de café para um patch ser considerado válido.
  coffee_min_ratio: 0.01
  normalization:
    strategy: "zscore"

# Protocolo de treinamento idêntico para ambas as arquiteturas.
training:
  batch_size: 8
  epochs: 60
  lr: 0.0001
  weight_decay: 0.0001
  num_workers: 2
  amp: true
  early_stopping_patience: 10
  # Perda multivariada: Dice + Focal + Boundary.
  loss:
    dice_weight: 1.0
    focal_weight: 1.0
    boundary_weight: 1.0
    focal_gamma: 2.0
    focal_alpha: 0.25

# Variantes arquiteturais comparadas (apenas a arquitetura difere).
models:
  unet:
    encoder_name: "resnet34"
    encoder_weights: "imagenet"
    in_channels: 4
    num_classes: 1
  segformer:
    pretrained_model_name: "nvidia/mit-b0"
    in_channels: 4
    num_labels: 1
    image_size: 512
    ignore_mismatched_sizes: true

# Métricas em nível de pixel avaliadas na fase de avaliação.
evaluation:
  metrics: ["iou", "f1", "precision", "recall"]

logging:
  level: "INFO"
